name: build

on:
  push:
    branches: [main, astro-migration]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/client
