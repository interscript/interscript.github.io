name: build

on:
  push:
  pull_request:
  repository_dispatch:
    types: [ 'interscript/interscript' ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
      - name: Install NPM dependencies
        run: |
          yarn install --frozen-lockfile
          yarn global add asciidoctor@^2.2.4
      - name: Build site
        run: |
          yarn adoc make
