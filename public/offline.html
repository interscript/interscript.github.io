<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Interscript</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter Tight", system-ui, sans-serif;
        background: #f6f3ec;
        color: #1a1d1f;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-size: 2.25rem;
        font-weight: 500;
        letter-spacing: -0.025em;
        margin: 0 0 1rem;
      }
      p {
        color: #5c5852;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      a {
        color: #008075;
        text-decoration: underline;
      }
      .mark {
        display: inline-block;
        width: 32px;
        height: 32px;
        margin-bottom: 1.5rem;
        transform: skewY(-2deg);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/symbol.svg" alt="" />
      <h1>You're offline.</h1>
      <p>
        The Interscript page you wanted isn't cached yet. Pages and map
        data you've visited before are available — try one of those, or
        reconnect to load the page fresh.
      </p>
      <p>
        <a href="/">← Back to home</a>
      </p>
    </main>
  </body>
</html>
